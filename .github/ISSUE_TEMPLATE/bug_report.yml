name: Bug report
description: Something is broken in the platform, playground, or tooling
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the defect and the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /playground
        2. Paste the following code ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: Browser, OS, Node version
