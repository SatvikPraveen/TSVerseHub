name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:types
      - run: npm run lint
      - run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == 20
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  research:
    name: Curriculum verification and benchmarks
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run research:verify
      - run: npm run research:benchmark -- --iterations 10 --out research/results/ci-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: research-results
          path: research/results
          retention-days: 30

  e2e:
    name: Browser smoke tests (Chromium)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  typescript-matrix:
    # TypeScript 7 (the native port) no longer ships the JavaScript Compiler
    # API that src/core/compiler is built on, so the supported range is 5.x.
    name: Curriculum under TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.5', '5.6', '5.9']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save typescript@${{ matrix.typescript }}
      - run: npx tsc --version
      - run: npm run research:verify -- --no-audit --out research/results/verify-ts-${{ matrix.typescript }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: verify-typescript-${{ matrix.typescript }}
          path: research/results/verify-ts-${{ matrix.typescript }}.json
          retention-days: 30
